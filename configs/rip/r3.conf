frr defaults traditional
hostname r3
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.3/32
exit
!
interface eth1
 description enlace-r1
 ip address 10.0.13.2/30
exit
!
interface eth2
 description enlace-r4
 ip address 10.0.34.1/30
exit
!
interface eth3
 description lan-h3
 ip address 192.168.3.1/24
exit
!
router rip
 version 2
 timers basic 30 180 120
 network eth1
 network eth2
 network eth3
 network lo
 passive-interface eth3
 passive-interface lo
exit
!
