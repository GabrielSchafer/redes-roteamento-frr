frr defaults traditional
hostname r3
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.3/32
exit
!
interface eth1
 description enlace-r1
 ip address 10.0.13.2/30
exit
!
interface eth2
 description enlace-r4
 ip address 10.0.34.1/30
exit
!
interface eth3
 description lan-h3
 ip address 192.168.3.1/24
exit
!
router bgp 65002
 bgp router-id 10.255.0.3
 no bgp ebgp-requires-policy
 timers bgp 60 180
 neighbor 10.0.13.1 remote-as 65001
 neighbor 10.0.13.1 description eBGP-r1
 neighbor 10.0.13.1 timers connect 10
 neighbor 10.0.34.2 remote-as 65003
 neighbor 10.0.34.2 description eBGP-r4
 neighbor 10.0.34.2 timers connect 10
 !
 address-family ipv4 unicast
  network 10.255.0.3/32
  network 192.168.3.0/24
  neighbor 10.0.13.1 activate
  neighbor 10.0.34.2 activate
 exit-address-family
exit
!
