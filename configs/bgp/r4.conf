frr defaults traditional
hostname r4
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.4/32
exit
!
interface eth1
 description enlace-r3
 ip address 10.0.34.2/30
exit
!
interface eth2
 description enlace-r5
 ip address 10.0.45.1/30
exit
!
interface eth3
 description lan-h4
 ip address 192.168.4.1/24
exit
!
router bgp 65003
 bgp router-id 10.255.0.4
 no bgp ebgp-requires-policy
 timers bgp 60 180
 neighbor 10.0.34.1 remote-as 65002
 neighbor 10.0.34.1 description eBGP-r3
 neighbor 10.0.34.1 timers connect 10
 neighbor 10.0.45.2 remote-as 65003
 neighbor 10.0.45.2 description iBGP-r5
 neighbor 10.0.45.2 timers connect 10
 !
 address-family ipv4 unicast
  network 10.255.0.4/32
  network 192.168.4.0/24
  neighbor 10.0.34.1 activate
  neighbor 10.0.45.2 activate
  neighbor 10.0.45.2 next-hop-self
 exit-address-family
exit
!
