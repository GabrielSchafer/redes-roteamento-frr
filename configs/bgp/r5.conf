frr defaults traditional
hostname r5
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.5/32
exit
!
interface eth1
 description enlace-r4
 ip address 10.0.45.2/30
exit
!
interface eth2
 description enlace-r2
 ip address 10.0.25.2/30
exit
!
interface eth3
 description lan-h5
 ip address 192.168.5.1/24
exit
!
router bgp 65003
 bgp router-id 10.255.0.5
 no bgp ebgp-requires-policy
 timers bgp 60 180
 neighbor 10.0.45.1 remote-as 65003
 neighbor 10.0.45.1 description iBGP-r4
 neighbor 10.0.45.1 timers connect 10
 neighbor 10.0.25.1 remote-as 65001
 neighbor 10.0.25.1 description eBGP-r2
 neighbor 10.0.25.1 timers connect 10
 !
 address-family ipv4 unicast
  network 10.255.0.5/32
  network 192.168.5.0/24
  neighbor 10.0.45.1 activate
  neighbor 10.0.45.1 next-hop-self
  neighbor 10.0.25.1 activate
 exit-address-family
exit
!
