frr defaults traditional
hostname r3
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.3/32
 ip ospf area 0
 ip ospf passive
exit
!
interface eth1
 description enlace-r1
 ip address 10.0.13.2/30
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf hello-interval 10
 ip ospf dead-interval 40
 ip ospf cost 100
exit
!
interface eth2
 description enlace-r4
 ip address 10.0.34.1/30
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf hello-interval 10
 ip ospf dead-interval 40
 ip ospf cost 100
exit
!
interface eth3
 description lan-h3
 ip address 192.168.3.1/24
 ip ospf area 0
 ip ospf passive
exit
!
router ospf
 ospf router-id 10.255.0.3
exit
!
