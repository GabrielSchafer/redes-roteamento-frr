name: redes

topology:
  nodes:
    r1:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1
      labels: {as: "65001"}
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv4.conf.all.rp_filter: 0
        net.ipv4.conf.default.rp_filter: 0
      binds:
        - configs/ativo/r1.conf:/etc/frr/frr.conf
        - configs/ativo/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
    r2:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1
      labels: {as: "65001"}
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv4.conf.all.rp_filter: 0
        net.ipv4.conf.default.rp_filter: 0
      binds:
        - configs/ativo/r2.conf:/etc/frr/frr.conf
        - configs/ativo/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
    r3:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1
      labels: {as: "65002"}
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv4.conf.all.rp_filter: 0
        net.ipv4.conf.default.rp_filter: 0
      binds:
        - configs/ativo/r3.conf:/etc/frr/frr.conf
        - configs/ativo/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
    r4:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1
      labels: {as: "65003"}
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv4.conf.all.rp_filter: 0
        net.ipv4.conf.default.rp_filter: 0
      binds:
        - configs/ativo/r4.conf:/etc/frr/frr.conf
        - configs/ativo/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
    r5:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1
      labels: {as: "65003"}
      sysctls:
        net.ipv4.ip_forward: 1
        net.ipv4.conf.all.rp_filter: 0
        net.ipv4.conf.default.rp_filter: 0
      binds:
        - configs/ativo/r5.conf:/etc/frr/frr.conf
        - configs/ativo/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
    h1:
      kind: linux
      image: nicolaka/netshoot:latest
      cmd: sleep infinity
      exec:
        - ip addr add 192.168.1.10/24 dev eth1
        - ip route add 192.168.0.0/16 via 192.168.1.1
        - ip route add 10.0.0.0/8 via 192.168.1.1
    h2:
      kind: linux
      image: nicolaka/netshoot:latest
      cmd: sleep infinity
      exec:
        - ip addr add 192.168.2.10/24 dev eth1
        - ip route add 192.168.0.0/16 via 192.168.2.1
        - ip route add 10.0.0.0/8 via 192.168.2.1
    h3:
      kind: linux
      image: nicolaka/netshoot:latest
      cmd: sleep infinity
      exec:
        - ip addr add 192.168.3.10/24 dev eth1
        - ip route add 192.168.0.0/16 via 192.168.3.1
        - ip route add 10.0.0.0/8 via 192.168.3.1
    h4:
      kind: linux
      image: nicolaka/netshoot:latest
      cmd: sleep infinity
      exec:
        - ip addr add 192.168.4.10/24 dev eth1
        - ip route add 192.168.0.0/16 via 192.168.4.1
        - ip route add 10.0.0.0/8 via 192.168.4.1
    h5:
      kind: linux
      image: nicolaka/netshoot:latest
      cmd: sleep infinity
      exec:
        - ip addr add 192.168.5.10/24 dev eth1
        - ip route add 192.168.0.0/16 via 192.168.5.1
        - ip route add 10.0.0.0/8 via 192.168.5.1

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r1:eth2", "r3:eth1"]
    - endpoints: ["r3:eth2", "r4:eth1"]
    - endpoints: ["r4:eth2", "r5:eth1"]
    - endpoints: ["r2:eth2", "r5:eth2"]
    - endpoints: ["r1:eth3", "h1:eth1"]
    - endpoints: ["r2:eth3", "h2:eth1"]
    - endpoints: ["r3:eth3", "h3:eth1"]
    - endpoints: ["r4:eth3", "h4:eth1"]
    - endpoints: ["r5:eth3", "h5:eth1"]
