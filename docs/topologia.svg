    <circle cx="200" cy="420" r="30"/>
    <circle cx="480" cy="210" r="30"/>
    <circle cx="760" cy="210" r="30"/>
    <circle cx="760" cy="420" r="30"/>
  </g>
  <g font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    <text x="200" y="216">R1</text>
    <text x="200" y="426">R2</text>
    <text x="480" y="216">R3</text>
    <text x="760" y="216">R4</text>
    <text x="760" y="426">R5</text>
  </g>
  <g font-size="11" fill="#34495E">
