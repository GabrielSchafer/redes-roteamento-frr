    <text x="162" y="424" text-anchor="end">lo 10.255.0.2</text>
    <text x="480" y="258" text-anchor="middle">lo 10.255.0.3</text>
    <text x="798" y="214">lo 10.255.0.4</text>
    <text x="798" y="424">lo 10.255.0.5</text>
  </g>

  <!-- Hosts -->
  <g fill="#F4F6F8" stroke="#8A949E" stroke-width="1.5">
    <rect x="140" y="68" width="120" height="44" rx="8"/>
    <rect x="420" y="68" width="120" height="44" rx="8"/>
    <rect x="700" y="68" width="120" height="44" rx="8"/>
    <rect x="140" y="518" width="120" height="44" rx="8"/>
    <rect x="700" y="518" width="120" height="44" rx="8"/>
  </g>
  <g text-anchor="middle" fill="#34495E">
    <text x="200" y="87" font-size="14" font-weight="bold">h1</text>
    <text x="200" y="103" font-size="11">192.168.1.10</text>
    <text x="480" y="87" font-size="14" font-weight="bold">h3</text>
    <text x="480" y="103" font-size="11">192.168.3.10</text>
    <text x="760" y="87" font-size="14" font-weight="bold">h4</text>
    <text x="760" y="103" font-size="11">192.168.4.10</text>
    <text x="200" y="537" font-size="14" font-weight="bold">h2</text>
    <text x="200" y="553" font-size="11">192.168.2.10</text>
    <text x="760" y="537" font-size="14" font-weight="bold">h5</text>
    <text x="760" y="553" font-size="11">192.168.5.10</text>
  </g>

  <!-- Legenda -->
  <g font-size="12" fill="#34495E">
    <circle cx="48" cy="648" r="9" fill="#0B6FB8"/>
    <text x="64" y="652">Roteador FRR 10.7.1</text>
    <rect x="200" y="638" width="28" height="20" rx="4" fill="#F4F6F8" stroke="#8A949E"/>
    <text x="236" y="652">Host (netshoot)</text>
    <line x1="360" y1="648" x2="400" y2="648" stroke="#34495E" stroke-width="3"/>
    <text x="408" y="652">Enlace normal (custo OSPF 10)</text>
    <line x1="610" y1="648" x2="650" y2="648" stroke="#D9480F" stroke-width="3" stroke-dasharray="10 6"/>
    <text x="658" y="652">Enlace lento (netem, custo OSPF 100)</text>
    <text x="30" y="682" font-size="11" fill="#6B7785">eth0 de cada nó é a rede de gerência do Containerlab (172.20.20.0/24) e fica fora do roteamento.</text>
  </g>
</svg>
