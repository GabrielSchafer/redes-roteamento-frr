<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="700" fill="#FFFFFF"/>

  <!-- Sistemas Autonomos -->
  <rect x="30" y="30" width="310" height="580" rx="14" fill="#EAF2FB" stroke="#3D85C6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="46" y="56" font-size="15" font-weight="bold" fill="#3D85C6">AS 65001</text>
  <rect x="380" y="30" width="200" height="270" rx="14" fill="#FDF1EC" stroke="#E07A5F" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="396" y="56" font-size="15" font-weight="bold" fill="#E07A5F">AS 65002</text>
  <rect x="620" y="30" width="310" height="580" rx="14" fill="#EEF6EA" stroke="#6AA84F" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="636" y="56" font-size="15" font-weight="bold" fill="#6AA84F">AS 65003</text>

  <!-- Enlaces de acesso (host - roteador) -->
  <g stroke="#9AA3AD" stroke-width="2">
    <line x1="200" y1="112" x2="200" y2="180"/>
    <line x1="480" y1="112" x2="480" y2="180"/>
    <line x1="760" y1="112" x2="760" y2="180"/>
    <line x1="200" y1="450" x2="200" y2="518"/>
    <line x1="760" y1="450" x2="760" y2="518"/>
  </g>

  <!-- Enlaces entre roteadores -->
  <g stroke="#34495E" stroke-width="3">
    <line x1="200" y1="240" x2="200" y2="390"/>
    <line x1="760" y1="240" x2="760" y2="390"/>
    <line x1="230" y1="420" x2="730" y2="420"/>
  </g>
  <g stroke="#D9480F" stroke-width="3" stroke-dasharray="10 6">
    <line x1="230" y1="210" x2="450" y2="210"/>
    <line x1="510" y1="210" x2="730" y2="210"/>
  </g>

  <!-- Rotulos dos enlaces -->
  <g font-size="12" fill="#34495E" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">
    <text x="212" y="310">10.0.12.0/30</text>
    <text x="212" y="326" fill="#3D85C6">iBGP</text>
    <text x="772" y="310">10.0.45.0/30</text>
    <text x="772" y="326" fill="#6AA84F">iBGP</text>
    <text x="480" y="410" text-anchor="middle">10.0.25.0/30 · eBGP</text>
    <text x="340" y="194" text-anchor="middle">10.0.13.0/30 · eBGP</text>
    <text x="620" y="194" text-anchor="middle">10.0.34.0/30 · eBGP</text>
  </g>
  <g font-size="11" fill="#D9480F" font-weight="bold" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">
    <text x="340" y="236" text-anchor="middle">lento · +10 ms · custo 100</text>
    <text x="620" y="236" text-anchor="middle">lento · +10 ms · custo 100</text>
  </g>

  <!-- Interfaces -->
  <g font-size="10" fill="#6B7785">
    <text x="236" y="203">eth2</text>
    <text x="444" y="203" text-anchor="end">eth1</text>
    <text x="516" y="203">eth2</text>
    <text x="724" y="203" text-anchor="end">eth1</text>
    <text x="190" y="256" text-anchor="end">eth1</text>
    <text x="190" y="382" text-anchor="end">eth1</text>
    <text x="750" y="256" text-anchor="end">eth2</text>
    <text x="750" y="382" text-anchor="end">eth1</text>
    <text x="236" y="438">eth2</text>
    <text x="724" y="438" text-anchor="end">eth2</text>
    <text x="190" y="176" text-anchor="end">eth3</text>
    <text x="470" y="176" text-anchor="end">eth3</text>
    <text x="750" y="176" text-anchor="end">eth3</text>
    <text x="190" y="472" text-anchor="end">eth3</text>
    <text x="750" y="472" text-anchor="end">eth3</text>
  </g>

  <!-- Redes de acesso -->
  <g font-size="11" fill="#6B7785">
    <text x="210" y="150">192.168.1.0/24</text>
    <text x="490" y="150">192.168.3.0/24</text>
    <text x="770" y="150">192.168.4.0/24</text>
    <text x="210" y="490">192.168.2.0/24</text>
    <text x="770" y="490">192.168.5.0/24</text>
  </g>

